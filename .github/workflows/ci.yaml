name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-ci-${{ runner.os }}

      - name: Format check
        run: nix develop --command just fmt-ci

      - name: Clippy
        run: nix develop --command just clippy-ci

      - name: Tests
        run: nix develop --command just test-ci
        timeout-minutes: 10

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-ci-${{ runner.os }}

      - name: Run zizmor
        run: nix develop --command zizmor .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
